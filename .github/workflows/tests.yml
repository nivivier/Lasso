# Analyse syntaxique + suite de tests, à chaque push et chaque pull request.
#
# Raison d'être : deux régressions silencieuses ont vécu longtemps dans le dépôt
# faute de ce garde-fou — un fichier de tests interrompu par une erreur fatale
# (donc dont la moitié des assertions ne tournait plus) et un correctif écrit,
# fonctionnel, mais jamais commité ni déployé. Les deux se voient ici.
#
# Aucune action tierce : seul actions/checkout (publié par GitHub) est utilisé,
# et le PHP préinstallé sur le runner suffit. Cohérent avec la règle du projet
# — pas de dépendance externe sans nécessité. vendor/ étant commité, il n'y a
# aucune étape d'installation.

name: Tests

on:
  push:
    branches: [main, stable]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version de PHP et extensions
        run: |
          php -v
          php -m

      # pdo_sqlite est indispensable (base de l'application et bases en mémoire
      # des tests). Présent par défaut sur le runner ; on échoue explicitement
      # plutôt que de laisser un test planter avec un message obscur.
      # Bloc « run: | » obligatoire ici, et non un scalaire sur une seule ligne :
      # la commande contient « : » suivi d'une espace (l'opérateur ternaire
      # « ? 0 : 1 »), que YAML interprète alors comme un séparateur clé/valeur.
      # Le fichier entier devenait inanalysable et GitHub refusait le workflow
      # avant même de démarrer un job — un échec qui ne ressemble pas à un test
      # rouge : le run s'affiche sans aucun job et porte le chemin du fichier
      # au lieu de son nom.
      - name: Vérifier pdo_sqlite
        run: |
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);' || { echo "pdo_sqlite manquant"; exit 1; }

      # La sortie est répétée en « ::error:: » quand la suite échoue : ces
      # lignes deviennent des annotations, visibles sur la page du run et
      # lisibles par l'API sans authentification — contrairement au journal
      # complet, qui exige un jeton. Sans ça, un échec ne se résume qu'à
      # « Process completed with exit code 1 », ce qui n'apprend rien.
      - name: Analyse syntaxique et tests
        run: |
          set +e
          php tests/run.php 2>&1 | tee sortie.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            grep -aE 'ÉCHEC|FAIL|Fatal|Parse error|Errors parsing|attendu' sortie.txt \
              | head -25 | while IFS= read -r ligne; do echo "::error::$ligne"; done
            echo "::error::php tests/run.php a échoué (code $code)"
          fi
          exit "$code"
